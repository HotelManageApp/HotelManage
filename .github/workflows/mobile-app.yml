name: mobile-app

on:
  pull_request:
    branches: [develop, main]
    paths: ["mobile-app/**", ".github/workflows/mobile-app.yml"]
  push:
    branches: [develop, main]
    paths: ["mobile-app/**", ".github/workflows/mobile-app.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-app

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  analyze-test:
    name: mobile-app / analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies (also generates l10n)
        run: flutter pub get

      # Commands must match the table in CLAUDE.md.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    # Debug APK only after code lands on develop; release signing is T57.
    name: mobile-app / build debug APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build debug APK
        run: |
          cp env/dev.example.json env/dev.json
          flutter pub get
          flutter build apk --debug --dart-define-from-file=env/dev.json

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
