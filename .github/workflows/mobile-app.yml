name: mobile-app

on:
  pull_request:
    branches: [develop, main]
    paths: ["mobile-app/**", ".github/workflows/mobile-app.yml"]
  push:
    branches: [develop, main]
    tags: ["v*"]
    paths: ["mobile-app/**", ".github/workflows/mobile-app.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-app

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  analyze-test:
    name: mobile-app / analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies (also generates l10n)
        run: flutter pub get

      # Commands must match the table in CLAUDE.md.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    # Debug APK after code lands on develop; the signed release APK is built for tags (below).
    name: mobile-app / build debug APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build debug APK
        run: |
          cp env/dev.example.json env/dev.json
          flutter pub get
          flutter build apk --debug --dart-define-from-file=env/dev.json

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  release-apk:
    # Signed release APK for a version tag (T57). Secrets (repository settings, never in git):
    #   ANDROID_KEYSTORE_B64      base64 of the release keystore (.jks)
    #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
    #   PROD_API_BASE_URL         https://api.<domain>
    #   GOOGLE_SERVICES_JSON_B64  base64 of google-services.json (push)
    name: mobile-app / signed release APK
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write signing key, Firebase config and prod settings
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          fi
          printf '{"API_BASE_URL":"%s","APP_ENV":"prod"}\n' "$PROD_API_BASE_URL" > env/prod.json

      - name: Build signed release APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define-from-file=env/prod.json

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/app/release.jks android/key.properties android/app/google-services.json

      - uses: actions/upload-artifact@v7
        with:
          name: hotel-guest-${{ github.ref_name }}
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
